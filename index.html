<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מחולל שקופית המלצות ספרייה</title>
  <style>
    :root { --blue:#1464b0; --panel:#f3f6fa; --text:#0f172a; }
    body{margin:0;font-family:Assistant,Arial,sans-serif;background:#e9eef5;color:var(--text)}
    .app{max-width:1100px;margin:16px auto;padding:16px;display:grid;gap:14px}
    .controls{background:#fff;border-radius:12px;padding:14px;display:grid;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    label{font-weight:700}
    input[type="text"]{flex:1;min-width:240px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:18px}
    input[type="file"]{padding:8px;border:1px dashed #94a3b8;border-radius:8px;background:var(--panel)}
    button{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:18px;font-weight:700;cursor:pointer}
    button.secondary{background:#334155}
    .preview-wrap{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .scale{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#dde6f3}
    .slide{position:relative;width:1920px;height:1080px;background:#fff;transform-origin:center center;overflow:hidden}
    .pattern{position:absolute;inset:0;background-image:radial-gradient(circle at 20% 20%,rgba(20,100,176,.05) 0 8px,transparent 9px),radial-gradient(circle at 75% 70%,rgba(20,100,176,.05) 0 7px,transparent 8px);background-size:140px 140px,120px 120px}
    .content{position:absolute;top:85px;left:80px;right:80px;text-align:center}
    .title{margin:0;font-size:79px;font-weight:700;line-height:1.1}
    .subtitle{margin:18px 0 0;font-size:62px;font-weight:400;line-height:1.2}
    .books{position:absolute;top:320px;left:90px;right:90px;display:flex;justify-content:center;gap:28px;z-index:2}
    .book{width:345px;height:545px;background:#f1f5f9;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.22);object-fit:cover}
    .overlay{position:absolute;inset:0;opacity:.5;pointer-events:none;object-fit:cover;z-index:3;width:100%;height:100%}
    .footer{position:absolute;left:0;right:0;bottom:0;height:170px;background:var(--blue);display:flex;align-items:center;justify-content:flex-start;padding:0 70px;color:#fff;font-size:46px;font-weight:700}
  </style>
</head>
<body>
  <div class="app">
    <div class="controls">
      <div class="row"><label for="titleInput">כותרת ראשית:</label><input id="titleInput" type="text" value="המלצות הספרנים.ות"></div>
      <div class="row"><label for="subtitleInput">כותרת משנה:</label><input id="subtitleInput" type="text" value="סיפורים חזקים"></div>
      <div class="row"><label for="logoInput">לוגו לבן לפוטר (אופציונלי):</label><input id="logoInput" type="file" accept="image/*"></div>
      <div class="row"><label for="imagesInput">העלאת תמונות (עד 4):</label><input id="imagesInput" type="file" accept="image/*" multiple></div>
      <div class="row">
        <button id="previewBtn" type="button">תצוגה מקדימה</button>
        <button id="exportBtn" type="button" class="secondary">ייצוא HTML</button>
      </div>
    </div>

    <div class="preview-wrap">
      <div class="scale" id="scaleWrap">
        <div class="slide" id="slide">
          <div class="pattern"></div>
          <div class="content">
            <h1 class="title" id="titleText">המלצות הספרנים.ות</h1>
            <h2 class="subtitle" id="subtitleText">סיפורים חזקים</h2>
          </div>
          <div class="books" id="books"></div>
          <img class="overlay" id="overlay" alt="decorative overlay" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO7dczQAAAAASUVORK5CYII=">
          <div class="footer"><img id="logo" alt="לוגו הספרייה" style="max-height:95px;max-width:340px;object-fit:contain" /></div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  const state={images:[],logo:"",overlay:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO7dczQAAAAASUVORK5CYII="};
  const el={titleInput:document.getElementById('titleInput'),subtitleInput:document.getElementById('subtitleInput'),imagesInput:document.getElementById('imagesInput'),logoInput:document.getElementById('logoInput'),titleText:document.getElementById('titleText'),subtitleText:document.getElementById('subtitleText'),books:document.getElementById('books'),logo:document.getElementById('logo'),previewBtn:document.getElementById('previewBtn'),exportBtn:document.getElementById('exportBtn'),scaleWrap:document.getElementById('scaleWrap'),slide:document.getElementById('slide'),overlay:document.getElementById('overlay')};

  const toDataURL=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});

  async function handleImages(files){state.images=[];for(const f of Array.from(files).slice(0,4)){state.images.push(await toDataURL(f));}renderBooks();}
  async function handleLogo(file){state.logo=file?await toDataURL(file):"";renderLogo();}

  function renderBooks(){el.books.innerHTML='';for(let i=0;i<4;i++){const img=document.createElement('img');img.className='book';img.alt='כריכת ספר';if(state.images[i]) img.src=state.images[i];el.books.appendChild(img);}}
  function renderLogo(){if(state.logo){el.logo.src=state.logo;el.logo.style.display='block';}else{el.logo.style.display='none';}}
  function updateText(){el.titleText.textContent=el.titleInput.value||'המלצות הספרנים.ות';el.subtitleText.textContent=el.subtitleInput.value||'';}

  function rescale(){const w=el.scaleWrap.clientWidth;const h=el.scaleWrap.clientHeight;const s=Math.min(w/1920,h/1080);el.slide.style.transform=`scale(${s})`;}

  function buildExportHtml(){
    const covers=[0,1,2,3].map(i=>state.images[i]||'');
    const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    return `<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>שקופית המלצות</title><style>body{margin:0;background:#111;display:flex;min-height:100vh;align-items:center;justify-content:center;font-family:Assistant,Arial,sans-serif}.slide{position:relative;width:1920px;height:1080px;background:#fff;overflow:hidden}.pattern{position:absolute;inset:0;background-image:radial-gradient(circle at 20% 20%,rgba(20,100,176,.05) 0 8px,transparent 9px),radial-gradient(circle at 75% 70%,rgba(20,100,176,.05) 0 7px,transparent 8px);background-size:140px 140px,120px 120px}.content{position:absolute;top:85px;left:80px;right:80px;text-align:center}.title{margin:0;font-size:79px;font-weight:700;line-height:1.1}.subtitle{margin:18px 0 0;font-size:62px;font-weight:400;line-height:1.2}.books{position:absolute;top:320px;left:90px;right:90px;display:flex;justify-content:center;gap:28px;z-index:2}.book{width:345px;height:545px;background:#f1f5f9;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.22);object-fit:cover}.overlay{position:absolute;inset:0;opacity:.5;pointer-events:none;object-fit:cover;z-index:3;width:100%;height:100%}.footer{position:absolute;left:0;right:0;bottom:0;height:170px;background:#1464b0;display:flex;align-items:center;justify-content:flex-start;padding:0 70px}.logo{max-height:95px;max-width:340px;object-fit:contain}</style></head><body><div class="slide"><div class="pattern"></div><div class="content"><h1 class="title">${esc(el.titleInput.value||'המלצות הספרנים.ות')}</h1><h2 class="subtitle">${esc(el.subtitleInput.value||'')}</h2></div><div class="books">${covers.map(c=>`<img class="book" src="${c}" alt="כריכה">`).join('')}</div><img class="overlay" src="${state.overlay}" alt="overlay"><div class="footer">${state.logo?`<img class="logo" src="${state.logo}" alt="לוגו">`:''}</div></div></body></html>`;
  }

  function exportHtml(){const blob=new Blob([buildExportHtml()],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='library-recommendation-slide.html';a.click();URL.revokeObjectURL(a.href);}  

  el.imagesInput.addEventListener('change',e=>handleImages(e.target.files));
  el.logoInput.addEventListener('change',e=>handleLogo(e.target.files[0]));
  el.previewBtn.addEventListener('click',()=>{updateText();renderBooks();renderLogo();});
  el.exportBtn.addEventListener('click',exportHtml);
  window.addEventListener('resize',rescale);

  updateText();renderBooks();renderLogo();el.overlay.src=state.overlay;rescale();
})();
</script>
</body>
</html>
